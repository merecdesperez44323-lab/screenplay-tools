# The Python implementation's tests, the one this fork maintains (README).
name: python
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    # setup-python has no 3.9 for Ubuntu 26.04, which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: python
        run: python -m unittest discover -s tests
      - name: Package builds
        working-directory: python
        run: python -m pip wheel --no-deps -w /tmp/wheel . && ls /tmp/wheel
